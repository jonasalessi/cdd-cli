name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The TypeScript analyzer embeds Tree-sitter through cgo, so a binary cannot be
# cross-compiled without a cross toolchain: every target builds on a runner of
# its own platform. Unix only for now, so no Windows target.
env:
  CGO_ENABLED: "1"

jobs:
  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: macos-latest, os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # A runner label that stops matching its image would otherwise ship a
      # binary for the wrong platform under the right name.
      - name: runner is ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: build
        run: make build VERSION=${{ github.ref_name }}

      - name: the binary runs and reports the tag
        run: |
          ./bin/cdd version
          ./bin/cdd version | grep -q "cdd ${{ github.ref_name }} "

      - name: it measures a project end to end
        run: |
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/src"
          printf 'export class Greeter {\n  hi(n: string) {\n    return n ? n : "hi"\n  }\n}\n' > "$work/src/greeter.ts"
          cd "$work"
          "$GITHUB_WORKSPACE/bin/cdd" init --yes --languages typescript
          "$GITHUB_WORKSPACE/bin/cdd" check

      - name: package
        run: |
          name="cdd_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp bin/cdd README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: cdd_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum *.tar.gz | tee checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.tar.gz dist/checksums.txt
