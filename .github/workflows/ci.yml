name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The TypeScript analyzer embeds Tree-sitter through cgo, so every job needs a
# C compiler. ubuntu-latest ships gcc.
env:
  CGO_ENABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build
      - run: ./bin/cdd version
      - name: dogfood config stays reproducible
        run: |
          ./bin/cdd init --yes --force --languages go --packages github.com/jonasalessi/cdd-cli
          git diff --exit-code cdd.config.yaml
